<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Compartida - Contadores</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Contadores</h2>
        </div>

        <!-- Cabecera informativa con producción total -->
        <div class="alert alert-primary d-flex align-items-center" role="alert" id="alertFiltrosDetalles">
            <i class="bi bi-calendar-event"></i> Fecha: - &nbsp;&nbsp;|&nbsp;&nbsp; <i class="bi bi-building"></i> Sala:
            - |&nbsp;&nbsp; Produccion: 0
        </div>

        <!-- Tabla de Contadores -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID REGISTRO</th>
                                <th>MAQUINA</th>
                                <th>INFO</th>
                                <th>CONTADORES</th>
                                <th>PRODUCCION</th>
                                <th class="text-center">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-maquinas">
                            <tr>
                                <td colspan="6" class="text-center py-4">Cargando datos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA VER INFO DE LA MÁQUINA -->
    <div class="modal fade" id="modalInfoMaquina" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Información de la Máquina</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="contenido-info-maquina">
                    <!-- Se llena dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = window.location.origin;
        let maquinasGlobal = [];

        // Función auxiliar inteligente para extraer texto o propiedades anidadas de objetos
        function extraerTexto(val) {
            if (val === null || val === undefined) return '-';
            if (typeof val === 'object') {
                return val.nombre || val.name || val.descripcion || val.label || val.valor || '-';
            }
            return val;
        }

        async function cargarDatosCompartidos() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                alert("No se especificó un ID de estadística.");
                return;
            }

            try {
                const res = await fetch(`${API}/api/estadistica/detalle/${id}`);
                if (!res.ok) throw new Error("No se pudo cargar la información.");

                const data = await res.json();
                maquinasGlobal = data.maquinas || data.detalles || [];

                // Formatear fecha
                const rawFecha = data.header?.fecha ? data.header.fecha.split('T')[0] : '';
                const partesFecha = rawFecha ? rawFecha.split('-') : [];
                const fechaFormateada = partesFecha.length === 3 ? `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}` : rawFecha;
                const nombreSala = data.header?.sucursal || data.header?.sucursal_nombre || 'N/A';

                // Calcular el total usando .reduce() seguro contra NaN
                const totalProduccion = maquinasGlobal.reduce((acc, item) => {
                    const maq = typeof item.info_maquina === 'string' ? JSON.parse(item.info_maquina) : (item.info_maquina || {});

                    const creditos = parseInt(item.contador_entrada || 0) - parseInt(item.contador_salida || 0);

                    const valorBruto = maq.valor_nom || maq.valor || item.valor || 0;
                    const textoValor = extraerTexto(valorBruto);

                    const valorNom = !isNaN(textoValor) ? parseFloat(textoValor) : 0;

                    const resultadoMaq = creditos * valorNom;
                    return acc + (isNaN(resultadoMaq) ? 0 : resultadoMaq);
                }, 0);

                const produccionFormateada = (isNaN(totalProduccion) ? 0 : totalProduccion).toLocaleString('es-ES', { minimumFractionDigits: 3, maximumFractionDigits: 3 });

                // Lógica de color para el badge Total
                let badgeTotalClass = 'bg-secondary';
                if (totalProduccion > 0) badgeTotalClass = 'bg-success';
                else if (totalProduccion < 0) badgeTotalClass = 'bg-danger';

                // Pintar cabecera informativa con el Badge
                document.getElementById('alertFiltrosDetalles').innerHTML =
                    `<i class="bi bi-calendar-event"></i> Fecha: ${fechaFormateada} &nbsp;&nbsp;|&nbsp;&nbsp; 
                     <i class="bi bi-building"></i> Sala: ${nombreSala} &nbsp;&nbsp;|&nbsp;&nbsp; 
                     Produccion: <span class="badge ${badgeTotalClass} fs-6">${produccionFormateada}</span>`;

                const tbody = document.getElementById('tabla-maquinas');
                tbody.innerHTML = '';

                if (maquinasGlobal.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4">No hay máquinas registradas.</td></tr>`;
                    return;
                }

                maquinasGlobal.forEach((item, index) => {
                    const maq = typeof item.info_maquina === 'string' ? JSON.parse(item.info_maquina) : (item.info_maquina || {});

                    const valorBruto = maq.valor_nom || maq.valor || item.valor;
                    const valorMaquina = extraerTexto(valorBruto);
                    const nombreMaq = extraerTexto(maq.nombre) !== '-' ? extraerTexto(maq.nombre) : (item.nombre_maquina || 'N/A');
                    const serialMaq = extraerTexto(maq.serial) !== '-' ? extraerTexto(maq.serial) : (item.serial || 'N/A');
                    const sociedadMaq = extraerTexto(maq.sociedad) !== '-' ? extraerTexto(maq.sociedad) : 'N/A';

                    const creditosMaq = parseInt(item.contador_entrada || 0) - parseInt(item.contador_salida || 0);

                    const numValorMaq = !isNaN(valorMaquina) ? parseFloat(valorMaquina) : 0;
                    const valorTotalMaq = creditosMaq * numValorMaq;

                    // Lógica de colores para los badges de la tabla
                    let badgeCreditos = 'bg-secondary';
                    if (creditosMaq > 0) badgeCreditos = 'bg-success';
                    else if (creditosMaq < 0) badgeCreditos = 'bg-danger';

                    let badgeValor = 'bg-secondary';
                    if (valorTotalMaq > 0) badgeValor = 'bg-success';
                    else if (valorTotalMaq < 0) badgeValor = 'bg-danger';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>
                            <small class="text-muted">Nombre: ${nombreMaq}</small> <br> 
                            <small class="text-muted">Serial: ${serialMaq}</small>
                        </td>
                        <td>
                            <small class="text-muted">Valor: ${valorMaquina}</small> <br> 
                            <small class="text-muted">Sociedad: ${sociedadMaq}</small>
                        </td>
                        <td>
                            <small class="text-muted">Entrada: ${item.contador_entrada || 0}</small> <br> 
                            <small class="text-muted">Salida: ${item.contador_salida || 0}</small>
                        </td>
                        <td>
                            <small class="text-muted fw-bold">Creditos:</small> <span class="badge ${badgeCreditos}">${creditosMaq}</span> <br> 
                            <small class="text-muted fw-bold">Valor:</small> <span class="badge ${badgeValor}">${valorTotalMaq.toLocaleString('es-ES')}</span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-1">
                                <button class="btn btn-outline-warning btn-action btn-sm text-dark fw-bold" onclick="verInfoMaquina(${index})">
                                    Info Maquina
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error de red:", error);
                alert("Error cargando los datos compartidos.");
            }
        }

        function verInfoMaquina(index) {
            const m = maquinasGlobal[index];
            if (!m) return;

            const info = typeof m.info_maquina === 'string' ? JSON.parse(m.info_maquina) : (m.info_maquina || {});

            function txt(val) {
                if (val === null || val === undefined || val === '') return 'N/A';
                if (typeof val === 'object') {
                    return val.nombre || val.name || val.descripcion || val.label || 'N/A';
                }
                return val;
            }

            const contenido = `
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between"><strong>ID:</strong> <span>${txt(info.id) !== 'N/A' ? txt(info.id) : (m.id || 'N/A')}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Nombre:</strong> <span>${txt(info.nombre) !== 'N/A' ? txt(info.nombre) : (m.nombre_maquina || 'N/A')}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Serial:</strong> <span>${txt(info.serial) !== 'N/A' ? txt(info.serial) : (m.serial || 'N/A')}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Puestos:</strong> <span>${txt(info.puestos || info.puesto)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Marca:</strong> <span>${txt(info.marca_nom || info.marca)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Modelo:</strong> <span>${txt(info.modelo_nom || info.modelo)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Tipo:</strong> <span>${txt(info.tipo_nom || info.tipo)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Valor:</strong> <span>${txt(info.valor_nom || info.valor)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Estado:</strong> <span>${txt(info.estado_nom || info.estado)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Sociedad:</strong> <span>${txt(info.sociedad_nom || info.sociedad)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Juego:</strong> <span>${txt(info.juego_nom || info.juego)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Modo:</strong> <span>${txt(info.modo_nom || info.modo)}</span></li>
                </ul>
            `;

            document.getElementById('contenido-info-maquina').innerHTML = contenido;

            const modalEl = document.getElementById('modalInfoMaquina');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        cargarDatosCompartidos();
    </script>
</body>

</html>
