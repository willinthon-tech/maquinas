<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Compartida - Contadores</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-4">
        <h2 class="mb-4">Contadores Estadistica</h2>

        <!-- Cabecera informativa -->
        <div class="alert alert-primary d-flex align-items-center" role="alert">
            <div>
                📅 <strong>Fecha:</strong> <span id="lbl-fecha">-</span> &nbsp;&nbsp;|&nbsp;&nbsp;
                🏢 <strong>Sala:</strong> <span id="lbl-sucursal">-</span>
            </div>
        </div>

        <!-- Tabla de Contadores -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID REGISTRO</th>
                            <th>NOMBRE DE MÁQUINA</th>
                            <th>CONTADOR ENTRADA</th>
                            <th>CONTADOR SALIDA</th>
                            <th class="text-end">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-maquinas">
                        <tr>
                            <td colspan="5" class="text-center py-4">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL PARA VER INFO DE LA MÁQUINA -->
    <div class="modal fade" id="modalInfoMaquina" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Información de la Máquina</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="contenido-info-maquina">
                    <!-- Se llena dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API = window.location.origin;
        let maquinasGlobal = [];

        async function cargarDatosCompartidos() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                alert("No se especificó un ID de estadística.");
                return;
            }

            try {
                const res = await fetch(`${API}/api/estadistica/detalle/${id}`);
                if (!res.ok) throw new Error("No se pudo cargar la información.");

                const data = await res.json();
                maquinasGlobal = data.maquinas;

                // Pintar cabecera
                //document.getElementById('lbl-fecha').textContent = data.header.fecha;
                document.getElementById('lbl-fecha').textContent = data.header.fecha ? data.header.fecha.split('T')[0] : '-';
                document.getElementById('lbl-sucursal').textContent = data.header.sucursal;



                const tbody = document.getElementById('tabla-maquinas');
                tbody.innerHTML = '';

                if (!data.maquinas || data.maquinas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-3">No hay máquinas registradas.</td></tr>`;
                    return;
                }

                data.maquinas.forEach((m, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${m.id}</td>
                        <td>
                            <strong>${m.nombre_maquina || 'N/A'}</strong><br>
                            <small class="text-muted">Serial: ${m.serial || 'S/N'}</small>
                        </td>
                        <td>${m.contador_entrada || 0}</td>
                        <td>${m.contador_salida || 0}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-info" onclick="verInfoMaquina(${index})">
                                Ver Info
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                alert("Error cargando los datos compartidos.");
            }
        }

        function verInfoMaquina(index) {
            const m = maquinasGlobal[index];
            if (!m) return;

            const info = m.info_maquina || {};

            // Función auxiliar para extraer texto si es objeto o string
            function txt(val) {
                if (val === null || val === undefined) return 'N/A';
                if (typeof val === 'object') {
                    return val.nombre || val.name || val.descripcion || val.label || 'N/A';
                }
                return val;
            }

            const contenido = `
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between"><strong>ID:</strong> <span>${txt(info.id) !== 'N/A' ? txt(info.id) : (m.id || 'N/A')}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Nombre:</strong> <span>${txt(info.nombre) !== 'N/A' ? txt(info.nombre) : (m.nombre_maquina || 'N/A')}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Serial:</strong> <span>${txt(info.serial) !== 'N/A' ? txt(info.serial) : (m.serial || 'N/A')}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Puestos:</strong> <span>${txt(info.puestos || info.puesto)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Marca:</strong> <span>${txt(info.marca_nom || info.marca)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Modelo:</strong> <span>${txt(info.modelo_nom || info.modelo)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Tipo:</strong> <span>${txt(info.tipo_nom || info.tipo)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Valor:</strong> <span>${txt(info.valor_nom || info.valor)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Estado:</strong> <span>${txt(info.estado_nom || info.estado)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Sociedad:</strong> <span>${txt(info.sociedad_nom || info.sociedad)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Juego:</strong> <span>${txt(info.juego_nom || info.juego)}</span></li>
                    <li class="list-group-item d-flex justify-content-between"><strong>Modo:</strong> <span>${txt(info.modo_nom || info.modo)}</span></li>
                </ul>
            `;

            document.getElementById('contenido-info-maquina').innerHTML = contenido;

            const modalEl = document.getElementById('modalInfoMaquina');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        cargarDatosCompartidos();
    </script>
</body>

</html>
